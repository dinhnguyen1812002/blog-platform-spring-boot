spring:
  application:
    name: blog-platform
  mail:
    host: localhost
  banner:
    location: nguyen.txt


  profiles:
    active: local

application:
  version: v1.0.0
  title: Spring Boot Blog Platform

server:
  port: 8080

# Config chung cho mọi môi trường
app:
  upload:
    avatar-dir: uploads/avatars

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always


