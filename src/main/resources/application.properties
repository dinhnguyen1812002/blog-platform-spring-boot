# Application Info
spring.application.name=blog-platform
application.version=v1.0.0
application.title=Spring Boot Blog Platform

# Server
server.port=8080

# Base URLs
base-url=http://localhost:8080
frontend-url=http://localhost:5173

# Database - Local (Override in profile-specific files for Docker/Prod)
spring.datasource.url=jdbc:mysql://localhost:3306/spring_blog
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



app.upload.avatar-dir=uploads/avatars
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# Logging
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.com.yourpackage=DEBUG
# logging.file.name=logs/app.log

# JWT Configuration
blog.app.jwtSecret=48226735186f1841e8d48215f709b70294cad4313ef992ac2d76665cd3a2946e
blog.app.jwtExpirationMs=180000
blog.app.jwtCookieName=token
blog.app.refreshTokenExpirationMs=604800000
blog.app.refreshTokenCookieName=refresh-token
blog.app.cookieSecure=false

# OAuth2 Client (Google)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# OAuth2 Client (GitHub)
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy-github-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# OAuth2 Client (Discord)
spring.security.oauth2.client.registration.discord.client-id=${DISCORD_CLIENT_ID:dummy-discord-client-id}
spring.security.oauth2.client.registration.discord.client-secret=${DISCORD_CLIENT_SECRET:dummy-discord-secret}
spring.security.oauth2.client.registration.discord.scope=identify,email
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/api/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
spring.security.oauth2.client.provider.discord.user-name-attribute=username

# OpenAPI / Swagger
blog.openapi.dev-url=http://localhost:8888
blog.openapi.prod-url=https://blog-api.com
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

